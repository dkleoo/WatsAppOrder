ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
    }
    application {
        modules = [com.example.watsapporderservices.ApplicationKt.module]
    }
}

database {
    url = ${?DATABASE_URL}
    user = ${?DATABASE_USER}
    password = ${?DATABASE_PASSWORD}
    maxPoolSize = "5"
    maxPoolSize = ${?DATABASE_MAX_POOL_SIZE}
}

jwt {
    secret = "watsapp-order-development-secret-key-change-me"
    secret = ${?JWT_SECRET}
    issuer = "watsapp-order"
    issuer = ${?JWT_ISSUER}
    audience = "watsapp-order-clients"
    audience = ${?JWT_AUDIENCE}
    realm = "watsapp-order"
    realm = ${?JWT_REALM}
    expirationMinutes = 60
    expirationMinutes = ${?JWT_EXPIRATION_MINUTES}
}

firebase {
    projectId = ""
    projectId = ${?FIREBASE_PROJECT_ID}
}

whatsapp {
    verifyToken = "orderwhatsapp_verify"
    verifyToken = ${?WHATSAPP_VERIFY_TOKEN}
    accessToken = ""
    accessToken = ${?WHATSAPP_ACCESS_TOKEN}
    accessToken = ${?WHATAPP_PERMANT}
    businessAccountId = "1415775780434889"
    businessAccountId = ${?WHATSAPP_BUSINESS_ACCOUNT_ID}
    phoneNumberId = "1379699841884103"
    phoneNumberId = ${?WHATSAPP_PHONE_NUMBER_ID}
    graphApiVersion = "v25.0"
    graphApiVersion = ${?WHATSAPP_GRAPH_API_VERSION}
}

groq {
    apiKey = ""
    apiKey = ${?GROQ_API_KEY}
    model = "openai/gpt-oss-120b"
    model = ${?GROQ_MODEL}
}

api {
    env = "development"
    env = ${?API_ENV}
}
