services:
  postgres:
    image: postgres:17-alpine
    container_name: watsapporder-postgres
    environment:
      POSTGRES_DB: watsapporder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - watsapporder-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d watsapporder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  watsapporder-postgres-data:
