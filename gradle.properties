#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.configuration-cache=true
org.gradle.caching=true
#Network resilience for CI/Docker builds (flaky DNS or slow Maven/Plugin Portal).
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
